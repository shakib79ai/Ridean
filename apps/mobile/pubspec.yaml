name: ridean
description: Ridean — rides, airport transfers, chauffeurs and car rental.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_stripe: ^11.3.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icons from the Ridean logo — CI runs `dart run flutter_launcher_icons` after `flutter create`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#112E18"
  adaptive_icon_foreground: assets/brand/app-icon-foreground.png
