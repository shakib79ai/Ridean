# /etc/nginx/sites-available/ridean  — then: certbot --nginx -d ridean.com -d www.ridean.com -d app.ridean.com -d admin.ridean.com -d api.ridean.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream ridean_api     { server 127.0.0.1:4000; }
upstream ridean_website { server 127.0.0.1:3000; }
upstream ridean_pwa     { server 127.0.0.1:3001; }
upstream ridean_admin   { server 127.0.0.1:3002; }

server {
  listen 80;
  server_name api.ridean.com;
  client_max_body_size 2m;
  location / {
    proxy_pass http://ridean_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name ridean.com www.ridean.com;
  location / { proxy_pass http://ridean_website; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
}

server {
  listen 80;
  server_name app.ridean.com;
  location / { proxy_pass http://ridean_pwa; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  # The service worker must never be cached by a CDN/proxy
  location = /sw.js { proxy_pass http://ridean_pwa; add_header Cache-Control "no-cache"; }
}

server {
  listen 80;
  server_name admin.ridean.com;
  # Optional: restrict to office/VPN IPs
  # allow 203.0.113.0/24; deny all;
  location / { proxy_pass http://ridean_admin; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
